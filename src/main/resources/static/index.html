<!DOCTYPE html>
<html>
<head>
    <title>Course Management</title>

    <style>

        body{
            font-family: Arial;
            margin:40px;
        }

        input{
            padding:8px;
            margin:5px;
        }

        button{
            padding:8px 12px;
            cursor:pointer;
        }

        .delete-btn{
            background:red;
            color:white;
            border:none;
        }

        table{
            width:100%;
            border-collapse: collapse;
            margin-top:20px;
        }

        th,td{
            border:1px solid black;
            padding:10px;
        }

        th{
            background:#eeeeee;
        }

    </style>
</head>

<body>

<h1>Course Management</h1>

<h3>Add Course</h3>

<input type="text" id="courseId" placeholder="Course ID">
<input type="text" id="courseName" placeholder="Course Name">
<input type="number" id="fee" placeholder="Fee">
<input type="number" id="capacity" placeholder="Capacity">
<input type="number" id="enrolledStudents" placeholder="Enrolled">

<button onclick="addCourse()">
    Add Course
</button>

<hr>

<h3>Search Course</h3>

<input type="text"
       id="searchId"
       placeholder="Enter Course ID">

<button onclick="searchCourse()">
    Search
</button>

<div id="searchResult"></div>

<table id="courseTable">

    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Fee</th>
        <th>Capacity</th>
        <th>Enrolled</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody></tbody>

</table>

<script>

    loadCourses();

    function loadCourses(){

        fetch('/api/courses')
            .then(response => response.json())
            .then(data => {

                let tableBody =
                    document.querySelector(
                        "#courseTable tbody"
                    );

                tableBody.innerHTML = "";

                data.forEach(course => {

                    tableBody.innerHTML += `
                <tr>

                    <td>${course.courseId}</td>

                    <td>${course.courseName}</td>

                    <td>${course.fee}</td>

                    <td>${course.capacity}</td>

                    <td>${course.enrolledStudents}</td>

                    <td>

                        <button
                        class="delete-btn"
                        onclick="deleteCourse(
                            '${course.courseId}')">

                            Delete

                        </button>

                    </td>

                </tr>
                `;

                });

            });

    }

    function addCourse(){

        let course = {

            courseId:
            document.getElementById(
                "courseId").value,

            courseName:
            document.getElementById(
                "courseName").value,

            fee:
                parseFloat(
                    document.getElementById(
                        "fee").value),

            capacity:
                parseInt(
                    document.getElementById(
                        "capacity").value),

            enrolledStudents:
                parseInt(
                    document.getElementById(
                        "enrolledStudents").value)
        };

        fetch('/api/courses',{

            method:'POST',

            headers:{
                'Content-Type':
                    'application/json'
            },

            body:
                JSON.stringify(course)
        })

            .then(response => response.text())

            .then(data =>{

                alert(data);

                location.reload();

            });

    }

    function deleteCourse(courseId){

        fetch('/api/courses/' + courseId,{

            method:'DELETE'

        })

            .then(response => response.text())

            .then(data =>{

                alert(data);

                location.reload();

            });

    }

    function searchCourse(){

        let courseId =
            document.getElementById(
                "searchId").value;

        fetch('/api/courses/' + courseId)

            .then(response => response.json())

            .then(course =>{

                document.getElementById(
                    "searchResult").innerHTML =

                    "<h4>" +
                    course.courseName +
                    " - Rs." +
                    course.fee +
                    "</h4>";

            })

            .catch(() => {

                document.getElementById(
                    "searchResult").innerHTML
                    =
                    "Course Not Found";

            });

    }

</script>

</body>
</html>
