<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Enrollments</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background: #f4f7f6; color: #333; }
        h1, h2 { color: #2c3e50; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input { padding: 10px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .btn-withdraw { background: #e74c3c; padding: 6px 12px; font-size: 12px; }
        .btn-withdraw:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .status-PENDING_PAYMENT { color: #f39c12; font-weight: bold; }
        .status-ACTIVE { color: #27ae60; font-weight: bold; }
        .status-WITHDRAWN { color: #7f8c8d; font-weight: bold; }
        .status-CANCELLED { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<!-- Test Login Section -->
<div class="card" id="loginSection" style="background: #fff3cd; border-left: 5px solid #ffc107;">
    <h2>Quick Login (Admin)</h2>
    <input type="email" id="loginEmail" placeholder="Email" value="admin@example.com" style="width: 200px;">
    <input type="password" id="loginPassword" placeholder="Password" value="admin12345" style="width: 150px;">
    <button onclick="doAdminLogin()" style="background: #ffc107; color: #000;">Login</button>
</div>

<h1>Admin Enrollment Management</h1>

<div class="card">
    <h2>All Enrollments</h2>
    <button onclick="loadAllEnrollments()" style="background:#95a5a6;">Refresh</button>
    <table>
        <thead>
        <tr>
            <th>Enrollment ID</th>
            <th>Request ID</th>
            <th>Student ID</th>
            <th>Offering ID</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="enrollmentTableBody">
        <tr><td colspan='6'>Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- JS -->
<script src="/js/admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadAllEnrollments();
    });
</script>
</body>
</html>
