<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | Registration Queue</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background: #f4f7f6; color: #333; }
        h1, h2 { color: #2c3e50; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input { padding: 10px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2980b9; }
        .btn-approve { background: #27ae60; }
        .btn-approve:hover { background: #219150; }
        .btn-reject { background: #e74c3c; }
        .btn-reject:hover { background: #c0392b; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #34495e; color: white; }
        .status-PENDING { color: #f39c12; font-weight: bold; }
        .status-APPROVED { color: #27ae60; font-weight: bold; }
        .status-REJECTED { color: #e74c3c; font-weight: bold; }
        #message { margin-top: 15px; color: #27ae60; font-weight: bold; }
        #error { margin-top: 15px; color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>


<h1>Admin Registration Queue</h1>

<div class="card">
    <h2>Process Next FIFO Request</h2>
    <p>Decide on the oldest PENDING request in the queue.</p>

    <div id="nextRequestDisplay" style="margin-bottom: 15px; font-weight: bold; color: #2c3e50;">
        No pending requests in queue.
    </div>

    <input type="text" id="reasonInput" placeholder="Reason (required for Reject)" style="width: 300px;">
    <label style="margin-right: 10px;">
        <input type="checkbox" id="isPaidCheckbox"> Is Paid Offering?
    </label>
    <br><br>
    <button class="btn-approve" onclick="processDecision('APPROVE')">Approve Next</button>
    <button class="btn-reject" onclick="processDecision('REJECT')">Reject Next</button>
    <div id="message"></div>
    <div id="error"></div>
</div>

<div class="card">
    <h2>All Requests History</h2>
    <button onclick="loadAdminRequests()" style="background:#95a5a6;">Refresh</button>
    <table>
        <thead>
        <tr>
            <th>Request ID</th>
            <th>Student ID</th>
            <th>Offering ID</th>
            <th>Seq</th>
            <th>Status</th>
            <th>Requested At</th>
        </tr>
        </thead>
        <tbody id="requestTableBody">
        <tr><td colspan='6'>Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- JS -->
<script src="/js/admin.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadAdminRequests();
    });
</script>
</body>
</html>
