<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Registrations | Student</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .status-PENDING { color: #f59e0b; font-weight: bold; }
        .status-APPROVED { color: #10b981; font-weight: bold; }
        .status-REJECTED, .status-CANCELLED { color: #ef4444; font-weight: bold; }
        .status-ACTIVE { color: #10b981; font-weight: bold; }
        .status-WITHDRAWN { color: #6b7280; font-weight: bold; }
        .top-links { margin-bottom: 20px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-links" style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <a href="/index.html">← Home</a> |
            <a href="/admin/registration-queue.html">Admin Queue</a>
        </div>
        <div style="font-weight: 600; color: var(--purple-700);">
            Logged in as: <span id="studentNameDisplay">Loading...</span>
        </div>
    </div>

    <h1>Student Registration Dashboard</h1>

    <div class="card">
        <h2>Submit New Request</h2>
        <div class="form-row">
            <label for="offeringIdInput">Offering ID</label>
            <input type="text" id="offeringIdInput" placeholder="Enter Offering ID (e.g. OFF_...)" />
        </div>
        <button class="btn btn-primary" onclick="submitRequest()">Submit Request</button>

        <div id="message" class="msg msg-ok"></div>
        <div id="error" class="msg msg-err"></div>
    </div>

    <div class="card">
        <h2>My Request History</h2>
        <button class="btn btn-secondary" onclick="loadMyRequests()" style="margin-bottom: 15px;">Refresh</button>
        <table>
            <thead>
            <tr>
                <th>Request ID</th>
                <th>Offering ID</th>
                <th>Seq</th>
                <th>Status</th>
                <th>Requested At</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="requestTableBody">
            <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>My Active Enrollments</h2>
        <button class="btn btn-secondary" onclick="loadMyEnrollments()" style="margin-bottom: 15px;">Refresh</button>
        <table>
            <thead>
            <tr>
                <th>Enrollment ID</th>
                <th>Offering ID</th>
                <th>Status</th>
                <th>Created At</th>
            </tr>
            </thead>
            <tbody id="enrollmentTableBody">
            <tr><td colspan="4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script src="/js/registration.js"></script>
</body>
</html>
