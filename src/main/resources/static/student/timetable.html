    <h1>My Timetable</h1>

    <p>Schedules for your active course registrations appear here.</p>

    <button type="button" id="refreshStudentTimetableButton">
        Refresh Timetable
    </button>

    <p id="studentTimetableMessage" role="status"></p>

    <table>
        <thead>
        <tr>
            <th>Offering ID</th>
            <th>Day</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Lecturer ID</th>

        </thead>
        <tbody id="studentTimetableTableBody"></tbody>
    </table>
