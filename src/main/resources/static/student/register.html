<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Student Course Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div style="height:6px; background: linear-gradient(90deg, #9333ea, #7c3aed, #581c87);"></div>

<div class="container" style="max-width:560px;">
    <div class="card">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:6px;">
            <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#9333ea,#581c87);display:flex;align-items:center;justify-content:center;font-size:22px;">🎓</div>
            <div>
                <h1 style="margin:0;font-size:24px;">Create your account</h1>
                <p style="margin:4px 0 0;color:#6b7280;font-size:14px;">Join CourseReg in seconds.</p>
            </div>
        </div>

        <div id="msg" class="msg" style="margin-top:20px;"></div>

        <form onsubmit="onRegister(event)" style="margin-top:20px;">
            <div class="form-row">
                <label for="regStudentNo">Student Number</label>
                <input type="text" id="regStudentNo" placeholder="e.g. ST2026001" required>
            </div>
            <div class="form-row">
                <label for="regFullName">Full Name</label>
                <input type="text" id="regFullName" placeholder="e.g. Nimal Perera" required>
            </div>
            <div class="form-row">
                <label for="regEmail">Email</label>
                <input type="email" id="regEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-row">
                <label for="regPassword">Password</label>
                <input type="password" id="regPassword" minlength="6" placeholder="Min 6 characters" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; padding:14px;">Create account</button>
        </form>

        <div class="top-links" style="text-align:center; margin-top:18px;">
            Already have an account? <a href="/student/login.html">Sign in</a>
        </div>
    </div>
</div>

<script src="/js/accounts.js"></script>
</body>
</html>
